<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>In Case</title><link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%231f1f1e'/%3E%3Cg fill='none' stroke='%23cbb98c' stroke-width='2.4' stroke-linecap='round'%3E%3Ccircle cx='10.5' cy='10.5' r='5.5'/%3E%3Cpath d='M14.8 14.8L19.5 19.5'/%3E%3C/g%3E%3C/svg%3E"><meta name="theme-color" content="#0c0c0b"><link rel="apple-touch-icon" href="apple-touch-icon.png">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Special+Elite&family=VT323&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--ink:#1f1f1e;--mu:#4a4a47;--paper:#efede8;--kraft:#cbb98c;--sticky:#e3d5b0;--red:#a82617}
html{height:100%;background:#0c0c0b;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;display:flex;flex-direction:column;font:15px 'Special Elite',Georgia,serif;color:var(--ink);background:linear-gradient(rgba(0,0,0,.05) 1px,transparent 1px) 0 0/100% 26px,radial-gradient(ellipse at 50% 35%,#d4d3ce,#b3b2ad)}
#app{flex:1;width:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column}
h1,h2,h3,p{margin:0}button,input,select,textarea{font:inherit}
.px{font-family:VT323,monospace;font-weight:400}.big{font-size:40px}.dim{color:#a9a8a2}.mu{color:var(--mu);font-size:13px}.mu2{color:#3d3d3a;font-size:13px}
.top{padding:16px 16px 18px;border-radius:0 0 28px 28px;color:#ecebe6;background:radial-gradient(ellipse at 15% 0%,rgba(203,185,140,.2),transparent 65%),linear-gradient(180deg,#0c0c0b,#242423);border-bottom:3px double #8a8a84}
.row{display:flex;gap:10px;align-items:center}
.bar{flex:1;height:12px;background:#1f1f1e;border:1px solid #55554f;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--kraft);border-radius:99px}
.mn{flex:1;padding:14px 16px 40px;display:flex;flex-direction:column;gap:12px}
.hd{margin:0;background:#d9ccae;color:var(--ink);font-size:22px;padding:2px 10px;letter-spacing:2px;border-left:4px solid #9a7d45}
.pg{position:relative;background:var(--paper);color:var(--ink);border-radius:3px;box-shadow:0 3px 7px rgba(0,0,0,.35);padding:14px 16px}
button.pg{border:0;width:100%;text-align:left;cursor:pointer;font:inherit}.cd{display:flex;flex-direction:column;gap:6px}
.st{background:var(--sticky)}.hw{font:600 21px/1.15 Caveat,cursive}
.q{display:flex;align-items:center;gap:14px;border:2px dashed #77766f;background:#dad8d1;box-shadow:none}
.stamp{border:2px solid var(--red);color:var(--red);font:19px VT323,monospace;padding:0 6px;transform:rotate(-6deg);display:inline-block}
.chip{font-size:11px;border:1px solid #77766f;padding:1px 6px;color:var(--mu);align-self:flex-start}
.bt{min-height:48px;padding:0 16px;background:var(--kraft);color:var(--ink);border:0;border-radius:3px;font-size:16px;cursor:pointer;width:100%}.bt.alt{background:#d9d7d0}.bt:disabled{opacity:.6;cursor:default}
.fl{font:19px VT323,monospace;color:#3d3d3a;margin-top:4px;display:block}
input,select,textarea{color:var(--ink);background:#f6f5f1;border:1px solid #77766f;border-radius:3px;padding:12px;min-height:44px;box-sizing:border-box;width:100%}
.wall{display:flex;gap:14px;flex-wrap:wrap}.pol{width:96px!important;padding:8px!important;text-align:center!important}.pol svg{width:100%;height:auto}
.hr{display:flex;align-items:center;gap:12px}.ib{width:46px;height:46px;flex:none;border-radius:16px;border:2px solid #ecebe6;background:none;color:#ecebe6;display:grid;place-items:center;padding:0;cursor:pointer}.ib.em{border-color:#55554f;color:#8a8a84;cursor:default}
.ttl{flex:1;min-width:0;text-align:center}.tt{font:27px/1 VT323,monospace;letter-spacing:3px}.sb{font-size:12px;color:#a9a8a2;margin-top:3px}
.av{width:46px;height:46px;flex:none;border-radius:50%;background:#050505;border:2px solid var(--kraft);color:#ecebe6;display:grid;place-items:center}
.rb{display:flex;align-items:center;gap:10px;margin-top:14px;font-size:19px}.trk{position:relative;flex:1;height:10px;border-radius:99px;background:#2f2f2e;border:1px solid #55554f}.trk i{display:block;height:100%;min-width:8px;border-radius:99px;background:linear-gradient(90deg,#9a7d45,#e3cd9b);position:relative}.trk i::after{content:"";position:absolute;right:-3px;top:-4px;width:14px;height:14px;border-radius:50%;background:#efe3c2;border:2px solid #1f1f1e;box-sizing:border-box}
.nv{position:sticky;bottom:10px;margin:0 14px 10px;padding:18px 6px 6px;display:grid;grid-template-columns:repeat(3,1fr);background:var(--paper);border-radius:34px;box-shadow:inset 0 0 0 4px var(--paper),inset 0 0 0 5px #8a897f,0 10px 22px rgba(0,0,0,.5)}
.nv button{display:flex;flex-direction:column;align-items:center;gap:2px;height:64px;padding:0;background:none;border:0;color:#3d3d3a;font:19px VT323,monospace;cursor:pointer}
.nv .m{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:#dddbd4;border:2px solid #1f1f1e;color:#1f1f1e;transition:transform .15s}.nv .l{transition:transform .15s}
.nv .on{color:var(--ink)}.nv .on .m{background:var(--c);transform:translateY(-12px) scale(1.12);box-shadow:0 4px 0 #1f1f1e}.nv .on .l{transform:translateY(-8px);text-decoration:underline wavy #1f1f1e;text-underline-offset:3px}
.tl{margin-left:8px;padding-left:22px;border-left:2px solid #55554f;display:flex;flex-direction:column;gap:10px}.tl .it{position:relative;display:flex;flex-direction:column;gap:2px;text-align:left;background:none;border:0;padding:0;font:inherit;color:var(--ink);cursor:pointer}.tl .it::before{content:"";position:absolute;left:-29px;top:4px;width:12px;height:12px;border-radius:50%;border:2px solid #1f1f1e;background:var(--paper)}.tl .dn::before{background:#1f1f1e}
.back{background:none;border:0;color:#3d3d3a;font:19px VT323,monospace;text-align:left;padding:0;min-height:32px;cursor:pointer}
.chk{display:flex;gap:10px;align-items:center;margin:6px 0}.chk input{width:24px;height:24px;min-height:0;accent-color:#1f1f1e}
</style></head><body><div id="app"></div>
<script>
const app=document.getElementById('app');
let S={cases:[],people:[],missions:[]},V={t:'cases'};
try{S=JSON.parse(localStorage.getItem('cf1'))||S}catch(x){}
const save=()=>{try{localStorage.setItem('cf1',JSON.stringify(S))}catch(x){}},
uid=()=>Math.random().toString(36).slice(2,9),
today=()=>new Date().toISOString().slice(0,10),
e=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),
g=(a,id)=>S[a].find(x=>x.id===id),
fd=d=>d?new Date(d).toLocaleDateString('en-GB',{day:'numeric',month:'short'}):'',
v=id=>{const el=document.getElementById(id);return el?el.value.trim():''},
fld=(id,l,val,p,t)=>`<label class="fl" for="${id}">${l}</label><input id="${id}" type="${t||'text'}" placeholder="${e(p||'')}" value="${e(val||'')}">`,
H=t=>`<h2 class="hd px">${t}</h2>`,
RK=[['Rookie',0],['Constable',3],['Sergeant',6],['Inspector',10]],
QS=['What does this team actually do?','What slows them down or frustrates them?','Who decides, or can introduce me to the person who does?'],
SIL='<svg viewBox="0 0 80 80" aria-hidden="true" style="background:#9c9b96;display:block;width:72px;height:72px"><circle cx="40" cy="30" r="14" fill="#2f2f2e"/><path d="M12 80c0-22 14-30 28-30s28 8 28 30z" fill="#2f2f2e"/></svg>',
LB={coffee:'Coffee',drinks:'Drinks',lunch:'Lunch',one:'1-1'},TC={cases:'#b7c58f',people:'#c9b6dc',missions:'#e3cd9b'},sv=(p,z)=>`<svg viewBox="0 0 24 24" width="${z||24}" height="${z||24}" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`,ICO={cases:'<path d="M3 7h6l2 2h10v10H3z"/>',people:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>',missions:'<path d="M4 8h12v6a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5z"/><path d="M16 10h2a2 2 0 0 1 0 4h-2"/>'},
opn=c=>c?c.qs.find(q=>!q.c):null,
tasks=c=>['Learn one non-work thing','Get introduced to someone'].concat(opn(c)?['Find out: '+opn(c).t]:[]);
function rank(){const n=S.missions.filter(m=>m.s==='done').length,i=RK.filter(r=>n>=r[1]).length-1,a=RK[i],b=RK[i+1];return{n,a:a[0],b,pct:b?(n-a[1])/(b[1]-a[1])*100:100}}
function tl(pid){const L=S.missions.filter(x=>x.pid===pid&&x.type==='one').sort((a,b)=>(a.date||'').localeCompare(b.date||''));if(!L.length)return '<p class="mu2">No 1-1s yet. Plan one and it will appear here.</p>';const gaps=L.map((x,i)=>i&&L[i-1].date&&x.date?Math.round((new Date(x.date)-new Date(L[i-1].date))/864e5):null).filter(x=>x!=null),avg=gaps.length?Math.round(gaps.reduce((a,b)=>a+b,0)/gaps.length):0;return `<p class="mu2">${L.length} 1-1${L.length>1?'s':''}${avg?' · about every '+avg+' days':''}</p><div class="tl">`+L.map((x,i)=>{const gp=i&&L[i-1].date&&x.date?Math.round((new Date(x.date)-new Date(L[i-1].date))/864e5):null;return (gp!=null?`<div class="mu">↓ ${gp} day${gp===1?'':'s'} later</div>`:'')+`<button class="it${x.s==='done'?' dn':''}" data-a="mission" data-id="${x.id}"><b>${fd(x.date)} <span class="mu">${x.s==='done'?'debriefed':'planned'}</span></b>${x.cl?`<span class="hw">${e(x.cl)}</span>`:''}${(x.fa||[]).map(t=>`<span class="mu">· ${e(t)}</span>`).join('')}${x.f?`<span class="mu">Follow up: ${fd(x.f)}</span>`:''}</button>`}).join('')+'</div>'}
function view(){
const p=g('people',V.id),c=g('cases',V.id),m=g('missions',V.id),k=V.s||V.t;
if(k==='cases')return H('ACTIVE CASES')+S.cases.map(c=>{const n=c.qs.filter(q=>q.c).length;return `<button class="pg cd" data-a="case" data-id="${c.id}"><b>${e(c.name)}</b><span class="mu">Goal: ${e(c.goal)}</span><span class="row"><span>Questions ${n}/${c.qs.length}</span><span class="stamp" style="margin-left:auto">${c.sol?'CLOSED':'OPEN'}</span></span></button>`}).join('')+`<button class="pg q" data-a="newcase"><span class="px big">?</span>Open a new case</button>`;
if(k==='newcase')return H('NEW CASE')+fld('nc','Case name (a team or department)','','The Case of the…')+fld('ng','Goal','','e.g. get a 20-minute intro call')+`<p class="mu2">Every case starts with three questions to answer through your conversations.</p><button class="bt" data-a="savecase">Open the case</button>`;
if(k==='case'&&c){const ps=S.people.filter(x=>x.cid===c.id),n=c.qs.filter(q=>q.c).length,who=cl=>{const x=g('people',cl.pid);return (x?e(x.name)+', ':'')+fd(cl.d)};
return `<div class="row"><span class="px">Questions</span><div class="bar"><i style="width:${n/c.qs.length*100}%"></i></div><span class="px">${n}/${c.qs.length}</span></div><p class="mu2">Goal: ${e(c.goal)}</p>`+H('SUSPECTS')+`<div class="wall">${ps.map(x=>`<button class="pg pol" data-a="person" data-id="${x.id}">${SIL}<span class="hw">${e(x.name.split(' ')[0])}</span></button>`).join('')}<button class="pg q" data-a="newsus" data-id="${c.id}" style="width:auto;flex:1;min-width:140px"><span class="px big">+</span>New suspect</button></div>${S.people.some(x=>!x.cid)?`<label class="fl" for="lk">Or add someone already in your book</label><div class="row"><select id="lk">${S.people.filter(x=>!x.cid).map(x=>`<option value="${x.id}">${e(x.name)}</option>`).join('')}</select><button class="bt alt" style="width:auto" data-a="link" data-id="${c.id}">Add</button></div>`:''}`+H('THE WALL')+`<p class="mu2">${ps.length?'To answer a ? question, open a mission with one of your suspects, start the debrief and pick the question under “It answers”.':'To answer a ? question, add a suspect first, then plan a mission with them and log the clue in the debrief.'}</p>`+c.qs.map((q,i)=>q.c?`<div class="pg st" style="transform:rotate(${i%2?1.2:-1.2}deg)"><div class="px mu" style="font-size:18px">${e(q.t)}</div><div class="hw">${e(q.c.text)}</div><div class="mu">${who(q.c)}</div></div>`:`<div class="pg q"><span class="px big">?</span><span>${e(q.t)}</span></div>`).join('')+(c.x||[]).map(cl=>`<div class="pg st"><div class="px mu" style="font-size:18px">EXTRA CLUE</div><div class="hw">${e(cl.text)}</div><div class="mu">${who(cl)}</div></div>`).join('')+H('ADD A QUESTION')+fld('aq','Something you want to find out','','e.g. Which reports do you build by hand?')+`<button class="bt alt" data-a="addq" data-id="${c.id}">Add question</button><p class="mu2">Your next open question shows up as a task in your mission briefings.</p>`+H('SOLVE')+(c.sol?`<div class="pg"><span class="stamp">CASE CLOSED</span><p class="hw" style="margin-top:8px">${e(c.sol.t)}</p><p class="mu">${fd(c.sol.d)}</p></div>`:`<label class="fl" for="sv">The next step (the service that fits, the meeting to book)</label><textarea id="sv" rows="3"></textarea><button class="bt" data-a="solve" data-id="${c.id}">Close the case</button>`)}
if(k==='people')return H('PEOPLE')+S.people.map(x=>{const cc=g('cases',x.cid);return `<button class="pg cd" data-a="person" data-id="${x.id}"><b>${e(x.name)}</b><span class="mu">${e(x.team)}${x.role?' · '+e(x.role):''}</span>${cc?`<span class="chip">${e(cc.name)}</span>`:''}</button>`}).join('')+`<button class="pg q" data-a="pform"><span class="px big">?</span>Add a person</button>`;
if(k==='pform'){const q=p||{};return H(p?'EDIT DOSSIER':'NEW DOSSIER')+fld('pn','Name',q.name)+fld('pt','Team',q.team)+fld('pr','Role',q.role)+fld('pm','Where you met',q.met)+`<label class="fl" for="pc">Case (optional)</label><select id="pc"><option value="">Not linked to a case</option>${S.cases.map(x=>`<option value="${x.id}"${x.id===(q.cid||V.pre)?' selected':''}>${e(x.name)}</option>`).join('')}</select><p class="mu2">You don’t need a case to save someone. Link one now or later.</p><button class="bt" data-a="saveperson" data-id="${q.id||''}">Save dossier</button>`}
if(k==='person'&&p){const ms=S.missions.filter(x=>x.pid===p.id);return `<div class="row" style="align-items:flex-start;gap:14px"><div class="pg" style="padding:8px">${SIL}</div><div><h2 style="font-size:22px">${e(p.name)}</h2><p class="mu2">${e(p.team)}${p.role?' · '+e(p.role):''}</p><p class="mu2">Met: ${e(p.met)}</p></div></div>`+H('FUN FACTS')+`<div class="pg">${p.facts.map(f=>`<p class="hw">${e(f.t)}</p>`).join('')||'<p class="mu">Nothing yet.</p>'}${fld('nf','Add a fact','','What they told you')}<button class="bt alt" style="margin-top:8px" data-a="addfact" data-id="${p.id}">Add fact</button></div><p class="mu2">Only note what they chose to tell you.</p><button class="bt" data-a="planfor" data-id="${p.id}">Plan a mission</button><button class="bt alt" data-a="pform" data-id="${p.id}">Edit dossier</button>`+H('1-1 TIMELINE')+tl(p.id)+H('MISSION LOG')+(ms.map(x=>`<button class="pg cd" data-a="mission" data-id="${x.id}"><span>${LB[x.type]} · ${fd(x.date)}</span><span class="stamp">${x.s==='done'?'DONE':'PLANNED'}</span></button>`).join('')||'<p class="mu2">No missions yet.</p>')}
if(k==='missions')return H('MISSIONS')+[...S.missions].sort((a,b)=>(a.date||'').localeCompare(b.date||'')).map(x=>{const q=g('people',x.pid);return `<button class="pg cd" data-a="mission" data-id="${x.id}"><b>${LB[x.type]} with ${e(q?q.name:'?')}</b><span class="row"><span class="mu">${fd(x.date)}</span><span class="stamp" style="margin-left:auto">${x.s==='done'?'DONE':'PLANNED'}</span></span></button>`}).join('')+`<button class="pg q" data-a="mform"><span class="px big">?</span>Plan a mission</button>`;
if(k==='mform')return H('NEW MISSION')+(S.people.length?`<label class="fl" for="mp">Who</label><select id="mp">${S.people.map(x=>`<option value="${x.id}"${x.id===V.id?' selected':''}>${e(x.name)}</option>`).join('')}</select><label class="fl" for="mt">What</label><select id="mt">${Object.keys(LB).map(x=>`<option value="${x}">${LB[x]}</option>`).join('')}</select>`+fld('md','When',today(),'','date')+`<button class="bt" data-a="savem">Create mission</button>`:'<p>Add a person first, then plan a mission.</p>');
if(k==='mission'&&m){const q=g('people',m.pid)||{facts:[],name:'?'},cc=g('cases',q.cid),l=q.facts[q.facts.length-1];
return `<h2 style="font-size:20px">${LB[m.type]} with ${e(q.name)}</h2><p class="mu2">${fd(m.date)}${cc?' · '+e(cc.name):''}</p>`+(m.s==='done'?`<div class="pg"><span class="stamp">DEBRIEFED</span><p style="margin-top:8px">${m.n} of ${m.tk.length} tasks done.</p>${m.f?`<p class="mu">Follow up: ${fd(m.f)}</p>`:''}</div>`:`<div class="pg st"><div class="px mu" style="font-size:18px">SUGGESTED OPENER</div><p class="hw">${l?'Ask about: '+e(l.t):'Ask how their week has been'}</p></div>`+H('YOUR TASKS')+`<div class="pg">${tasks(cc).map((t,i)=>`<p style="margin:6px 0"><span class="px" style="font-size:24px">${i+1}</span> ${e(t)}</p>`).join('')}</div><button class="bt" data-a="debrief" data-id="${m.id}">Start debrief</button>`)}
if(k==='debrief'&&m){const q=g('people',m.pid),cc=g('cases',q.cid);return H('DEBRIEF')+`<div class="pg">${tasks(cc).map((t,i)=>`<label class="chk"><input type="checkbox" class="tk" value="${e(t)}">${e(t)}</label>`).join('')}</div><label class="fl" for="df">New facts (one per line)</label><textarea id="df" rows="3" placeholder="Anything they volunteered…"></textarea>`+(cc?`<label class="fl" for="dc">Clue: what did you learn about the case?</label><textarea id="dc" rows="2"></textarea><label class="fl" for="dq">It answers</label><select id="dq">${cc.qs.map((x,i)=>x.c?'':`<option value="${i}">${e(x.t)}</option>`).join('')}<option value="x">Extra clue</option></select>`:'<p class="mu2">Link this person to a case to log clues.</p>')+fld('dd','Follow up on','','','date')+`<button class="bt" data-a="file" data-id="${m.id}">File report</button>`}
return '<p>Nothing here.</p>'}
function render(){const r=rank();app.innerHTML=`<header class="top"><div class="hr">${V.s?`<button class="ib" data-a="tab" data-id="${V.t}" aria-label="Back">${sv('<path d="M15 5l-7 7 7 7"/>')}</button>`:`<div style="width:46px;flex:none" aria-hidden="true"></div>`}<div class="ttl"><div class="tt">IN CASE</div><div class="sb">${r.a} · ${r.b?(r.b[1]-r.n)+' mission'+(r.b[1]-r.n===1?'':'s')+' to '+r.b[0]+' ↑':'top rank reached'}</div></div><div class="av" aria-hidden="true">${sv('<path d="M4 12h16"/><path d="M7 12V8a5 5 0 0 1 10 0v4"/><circle cx="12" cy="17" r="3"/>')}</div></div><div class="rb"><span class="px">${r.a}</span><div class="trk"><i style="width:${r.pct}%"></i></div><span class="px dim">${r.b?r.b[0]:'Max'}</span></div></header><main class="mn">${view()}</main><nav class="nv">${['cases','people','missions'].map(t=>`<button data-a="tab" data-id="${t}" style="--c:${TC[t]}"${V.t===t?' class="on" aria-current="page"':''}><span class="m">${sv(ICO[t],22)}</span><span class="l">${t[0].toUpperCase()+t.slice(1)}</span></button>`).join('')}</nav>`;window.scrollTo(0,0)}
const go=(s,id)=>{V={t:V.t,s,id};render()};
const A={
tab:t=>{V={t};render()},
newcase:()=>go('newcase'),
savecase:()=>{const n=v('nc');if(!n)return;S.cases.push({id:uid(),name:n,goal:v('ng'),qs:QS.map(t=>({t,c:null})),x:[],sol:null});save();A.tab('cases')},
case:id=>go('case',id),
newsus:id=>{V={t:'cases',s:'pform',pre:id};render()},
link:id=>{const pid=v('lk');if(!pid)return;g('people',pid).cid=id;save();render()},
addq:id=>{const t=v('aq');if(!t)return;g('cases',id).qs.push({t,c:null});save();render()},
solve:id=>{const t=v('sv');if(!t)return;g('cases',id).sol={t,d:today()};save();render()},
person:id=>go('person',id),
pform:id=>go('pform',id),
saveperson:id=>{const n=v('pn');if(!n)return;let q=id&&g('people',id);if(!q){q={id:uid(),facts:[]};S.people.push(q)}Object.assign(q,{name:n,team:v('pt'),role:v('pr'),met:v('pm'),cid:v('pc')});save();if(V.pre)go('case',V.pre);else go('person',q.id)},
addfact:id=>{const t=v('nf');if(!t)return;g('people',id).facts.push({t,d:today()});save();render()},
planfor:id=>{V={t:'missions',s:'mform',id};render()},
